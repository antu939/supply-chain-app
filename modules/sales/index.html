<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sales &amp; Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="3.5" cy="9" r="2.2" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="14.5" cy="4.2" r="2.2" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="14.5" cy="13.8" r="2.2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M5.6 8.2L12.3 5.1M5.6 9.8L12.3 12.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-copy"><strong>Sales Workspace</strong></span>
      <button type="button" class="sku-chip" id="brandSku" data-app-action="open-bom" title="View Product & BOM">No Product</button>
    </div>

    <nav class="mainnav" aria-label="Primary Views">
      <button type="button" data-nav="dashboard" class="active">Overview</button>
      <button type="button" data-nav="supply">Supply &amp; Batches</button>
      <button type="button" data-nav="logistics">Logistics &amp; Customs</button>
      <button type="button" data-nav="market">Markets &amp; Demand</button>
    </nav>

    <div class="appbar-actions">
      <span class="save-state" id="saveState">Saved</span>
      <div class="action-cluster" role="group" aria-label="History">
        <button type="button" class="icon-btn" data-app-action="undo" id="undoBtn" title="Undo (⌘Z)" aria-label="Undo">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3 2.5 6.5 6 10"/><path d="M2.5 6.5h7a3.5 3.5 0 0 1 0 7H7"/></svg>
        </button>
        <button type="button" class="icon-btn" data-app-action="redo" id="redoBtn" title="Redo (⇧⌘Z)" aria-label="Redo">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3l3.5 3.5L10 10"/><path d="M13.5 6.5h-7a3.5 3.5 0 0 0 0 7H9"/></svg>
        </button>
      </div>
      <div class="action-cluster" role="group" aria-label="Import and Export">
        <button type="button" class="icon-btn" data-app-action="import-world" id="importWorldBtn" title="Import JSON" aria-label="Import JSON">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10V2.5M4.75 5.75 8 2.5l3.25 3.25"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>
        </button>
        <button type="button" class="icon-btn" data-app-action="export-world" id="exportWorldBtn" title="Export JSON" aria-label="Export JSON">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5V10M4.75 6.75 8 10l3.25-3.25"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>
        </button>
      </div>
      <div class="menu-anchor">
        <button type="button" class="icon-btn" data-app-action="toggle-more" aria-label="More Actions">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="13" cy="8" r="1.2"/></svg>
        </button>
        <div class="menu hidden" id="moreMenu" role="menu">
          <button type="button" role="menuitem" data-app-action="open-bom">Product &amp; BOM Reference…</button>
          <button type="button" role="menuitem" data-app-action="open-lanes">Shipping Lanes…</button>
          <button type="button" role="menuitem" data-app-action="open-facts">Confirmed Facts Ledger…</button>
          <div class="menu-sep" role="separator"></div>
          <button type="button" role="menuitem" data-app-action="export-world">Export Backup (JSON)</button>
          <button type="button" role="menuitem" data-app-action="import-world">Import Backup (JSON)</button>
          <button type="button" role="menuitem" data-app-action="import-bom">Link BOM JSON (Read-only)</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main" id="main"></main>

  <footer class="statusbar">
    <span id="status"></span>
    <span class="status-hint" id="statusHint"></span>
  </footer>
</div>

<div class="panel-layer hidden" id="panelLayer" aria-hidden="true">
  <div class="panel-scrim" data-close-panel="1"></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="true" tabindex="-1"></aside>
</div>

<dialog id="dialog" aria-labelledby="dialogTitle">
  <form id="dialogForm">
    <header class="dialog-head">
      <div class="dialog-heading">
        <h2 id="dialogTitle"></h2>
        <p class="dialog-subtitle" id="dialogSubtitle"></p>
      </div>
      <button type="button" class="icon-btn" data-close-dialog="1" aria-label="Close">✕</button>
    </header>
    <div class="dialog-body" id="dialogBody"></div>
    <p class="dialog-error" id="dialogError" role="alert"></p>
    <footer class="dialog-foot" id="dialogFooter"></footer>
  </form>
</dialog>

<input id="importWorldInput" type="file" accept=".json,application/json" hidden>
<input id="importBomInput" type="file" accept=".json,application/json" hidden>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="../../shared/bridge.js"></script>
<script src="../../shared/bom-factories.js"></script>
<script src="js/timeseries.js"></script>
<script src="js/world-model.js"></script>
<script src="js/sim-engine.js"></script>
<script src="js/actions.js"></script>
<script src="js/demo-world.js"></script>
<script src="js/timeseries-editor.js"></script>
<script src="js/network-canvas.js"></script>
<script src="js/inspector.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
<script src="js/host-bridge.js"></script>
</body>
</html>
