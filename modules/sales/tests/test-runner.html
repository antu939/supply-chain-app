<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Sales 供应链业务系统 V0.2 单元测试报告</title>
<style>
  body { font: 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #f3f5f1; color: #1c241f; padding: 28px; max-width: 820px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  pre { background: #fff; border: 1px solid #e3e6df; border-radius: 10px; padding: 16px 18px; white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<h1>Sales 供应链业务系统 V0.2 核心引擎与回归测试</h1>
<pre id="out">运行中…</pre>
<script src="../js/timeseries.js"></script>
<script src="../js/world-model.js"></script>
<script src="../js/sim-engine.js"></script>
<script src="../js/actions.js"></script>
<script src="../js/demo-world.js"></script>
<script>
  const out = document.getElementById("out");
  const lines = [];
  const origLog = console.log;
  console.log = (...a) => { lines.push(a.join(" ")); origLog(...a); };
  window.load = undefined;
  window.require = (p) => {
    if (p.includes("timeseries")) return window.SC.TimeSeries;
    if (p.includes("world-model")) return window.SC.WorldModel;
    if (p.includes("sim-engine")) return window.SC.SimEngine;
    if (p.includes("actions")) return window.SC.Actions;
    if (p.includes("demo-world")) return window.SC.DemoWorld;
  };
</script>
<script src="engine.test.js"></script>
<script>
  out.textContent = lines.join("\n");
</script>
</body>
</html>
