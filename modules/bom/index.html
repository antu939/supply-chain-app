<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.ico">
<title>BOM &amp; Compliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <rect x="1" y="1" width="6.4" height="6.4" rx="1.7" stroke="currentColor" stroke-width="1.4"/>
          <rect x="10.6" y="1" width="6.4" height="6.4" rx="1.7" stroke="currentColor" stroke-width="1.4"/>
          <rect x="1" y="10.6" width="6.4" height="6.4" rx="1.7" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.6 13.8h6.4M13.8 10.6v6.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-copy"><strong>BOM Workspace</strong></span>
    </div>
    <nav class="mainnav" aria-label="Primary Views">
      <button type="button" data-action="nav-bom" data-nav="bom">BOM Tree</button>
      <button type="button" data-action="nav-subjects" data-nav="subjects">Companies</button>
      <button type="button" data-action="nav-risk" data-nav="risk">Market Access</button>
    </nav>
    <div class="appbar-actions">
      <span class="save-state" id="saveState">Saved</span>
      <div class="action-cluster" role="group" aria-label="History">
        <button type="button" class="icon-btn" data-action="undo" id="undoBtn" title="Undo (⌘Z)" aria-label="Undo">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3 2.5 6.5 6 10"/><path d="M2.5 6.5h7a3.5 3.5 0 0 1 0 7H7"/></svg>
        </button>
        <button type="button" class="icon-btn" data-action="redo" id="redoBtn" title="Redo (⇧⌘Z)" aria-label="Redo">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3l3.5 3.5L10 10"/><path d="M13.5 6.5h-7a3.5 3.5 0 0 0 0 7H9"/></svg>
        </button>
      </div>
      <div class="action-cluster" role="group" aria-label="Import and Export">
        <button type="button" class="icon-btn" data-action="import-data" id="importBtn" title="Import JSON" aria-label="Import JSON">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10V2.5M4.75 5.75 8 2.5l3.25 3.25"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>
        </button>
        <button type="button" class="icon-btn" data-action="export-data" id="exportBtn" title="Export JSON" aria-label="Export JSON">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5V10M4.75 6.75 8 10l3.25-3.25"/><path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2"/></svg>
        </button>
      </div>
      <button type="button" class="btn primary new-bom" data-action="new-document"><span class="btn-plus" aria-hidden="true">+</span>New BOM</button>
      <div class="menu-anchor">
        <button type="button" class="icon-btn" data-action="toggle-more" id="moreBtn" aria-label="More Actions" aria-expanded="false">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="13" cy="8" r="1.2"/></svg>
        </button>
        <div class="menu hidden" id="moreMenu" role="menu">
          <button type="button" role="menuitem" data-action="check">Validate BOM Integrity</button>
          <button type="button" role="menuitem" data-action="load-legacy" id="legacyWorkspaceItem" class="hidden">Restore Previous Workspace…</button>
          <div class="menu-sep" role="separator"></div>
          <button type="button" role="menuitem" data-action="export-data">Export Backup (JSON)</button>
          <button type="button" role="menuitem" data-action="import-data">Import Backup (JSON)</button>
          <div class="menu-sep" role="separator"></div>
          <button type="button" role="menuitem" class="danger" data-action="delete-document">Delete Current BOM…</button>
        </div>
      </div>
    </div>
  </header>

  <div class="subbar" id="subbar"></div>
  <main class="main" id="main"></main>

  <footer class="statusbar">
    <span id="status"></span>
    <span class="status-hint" id="statusHint"></span>
  </footer>
</div>

<div class="panel-layer hidden" id="panelLayer" aria-hidden="true">
  <div class="panel-scrim" data-action="close-panel"></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="true" tabindex="-1"></aside>
</div>

<dialog id="dialog" aria-labelledby="dialogTitle">
  <form id="dialogForm">
    <header class="dialog-head">
      <div class="dialog-heading">
        <h2 id="dialogTitle"></h2>
        <p class="dialog-subtitle" id="dialogSubtitle"></p>
      </div>
      <button type="button" class="icon-btn" data-action="close-dialog" aria-label="Close">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </header>
    <div class="dialog-body" id="dialogBody"></div>
    <p class="dialog-error" id="dialogError" role="alert"></p>
    <footer class="dialog-foot" id="dialogFooter"></footer>
  </form>
</dialog>

<input id="importDataInput" type="file" accept=".json,application/json" hidden>
<div id="contextMenu" class="context-menu hidden" role="menu"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="../../shared/bridge.js"></script>
<script src="../../shared/bom-factories.js"></script>
<script src="js/model.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/core.js"></script>
<script src="js/bom-view.js"></script>
<script src="js/supply-view.js"></script>
<script src="js/risk-view.js"></script>
<script src="js/subjects-view.js"></script>
<script src="js/inspector.js"></script>
<script src="js/commands.js"></script>
<script src="js/events.js"></script>
<script src="js/canvas-interaction.js"></script>
<script src="js/host-bridge.js"></script>
</body>
</html>
