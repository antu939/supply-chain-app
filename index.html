<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Supply Chain</title>
  <link rel="icon" href="modules/bom/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="app/app.css">
  <link rel="stylesheet" href="app/ai-sidebar.css">
</head>
<body>
  <div class="shell">
    <header class="shell-bar">
      <button type="button" class="shell-brand" data-route="overview" aria-label="Back to Overview">
        <span class="shell-brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="1.5" y="1.5" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.5"/>
            <rect x="10.5" y="1.5" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.5"/>
            <rect x="1.5" y="10.5" width="6" height="6" rx="1.6" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="13.5" cy="13.5" r="3" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </span>
        <span class="shell-brand-name">Supply Chain</span>
      </button>

      <nav class="shell-nav" aria-label="Primary Navigation">
        <button type="button" class="shell-nav-btn is-active" data-route="overview" aria-current="page">Overview</button>
        <button type="button" class="shell-nav-btn" data-route="bom">BOM &amp; Compliance</button>
        <button type="button" class="shell-nav-btn" data-route="sales">Sales &amp; Operations</button>
      </nav>

      <div class="shell-actions">
        <span class="shell-save-state" id="shellSaveState">Saved</span>
        <button type="button" class="shell-ai-btn" id="shellAiBtn" aria-expanded="false" aria-controls="aiSidebar">
          <span class="shell-ai-dot" aria-hidden="true"></span>
          <span>AI Assistant</span>
        </button>
        <div class="shell-menu-wrap">
          <button type="button" class="shell-icon-btn" id="shellMenuBtn" aria-label="More Options" aria-expanded="false" aria-haspopup="menu">
            <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
              <circle cx="3" cy="8" r="1.25"/>
              <circle cx="8" cy="8" r="1.25"/>
              <circle cx="13" cy="8" r="1.25"/>
            </svg>
          </button>
          <div class="shell-menu hidden" id="shellMenu" role="menu">
            <button type="button" role="menuitem" data-shell-action="refresh">Refresh Data</button>
          </div>
        </div>
      </div>
    </header>

    <div class="shell-body">
      <main class="shell-workspace" id="shellWorkspace">
        <section class="shell-view shell-overview is-active" id="overviewView" aria-label="Overview"></section>
        <section class="shell-view shell-module" id="bomView" aria-label="BOM & Compliance"></section>
        <section class="shell-view shell-module" id="salesView" aria-label="Sales & Operations"></section>
      </main>
      <aside class="ai-sidebar hidden" id="aiSidebar" aria-label="AI Assistant"></aside>
    </div>
  </div>

  <script src="shared/bridge.js"></script>
  <script src="storage/snapshot.js"></script>
  <script src="storage/data-store.js"></script>
  <script src="modules/sales/js/timeseries.js"></script>
  <script src="modules/sales/js/world-model.js"></script>
  <script src="modules/sales/js/sim-engine.js"></script>
  <script src="modules/sales/js/actions.js"></script>
  <script src="shared/ai-query.js"></script>
  <script src="shared/ai-privacy-schema.js"></script>
  <script src="shared/ai-anonymizer.js"></script>
  <script src="shared/ai-privacy.js"></script>
  <script src="shared/ai-tool-registry.js"></script>
  <script src="shared/ai-tool-handlers.js"></script>
  <script src="shared/ai-tools.js"></script>
  <script src="shared/ai-audit.js"></script>
  <script src="shared/ai-mutations.js"></script>
  <script src="shared/ai-client.js"></script>
  <script src="app/ai-sidebar.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
